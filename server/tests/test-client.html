<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV Utility Platform - API Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 2px solid #e0e0e0;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .log-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .log-success {
            color: #4ade80;
        }

        .log-error {
            color: #ff6b6b;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-warning {
            color: #fbbf24;
        }

        .download-button {
            background: #10b981;
            margin-top: 15px;
        }

        .download-button:hover {
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-pending {
            background: #fbbf24;
            color: #78350f;
        }

        .status-processing {
            background: #60a5fa;
            color: #1e3a8a;
        }

        .status-completed {
            background: #4ade80;
            color: #14532d;
        }

        .status-failed {
            background: #ff6b6b;
            color: #7f1d1d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎬 AV Utility Platform</h1>
        <p class="subtitle">API Test Client - Cloudflare R2 Architecture</p>

        <!-- File Upload Section -->
        <div class="section">
            <h2>Step 1: Select File</h2>
            <div class="form-group">
                <label for="fileInput">Choose Media File:</label>
                <input type="file" id="fileInput" accept="video/*,audio/*">
            </div>
            <div class="form-group">
                <label for="operationType">Operation Type:</label>
                <select id="operationType">
                    <option value="video-compress">Video Compression</option>
                    <option value="extract-audio">Extract Audio</option>
                    <option value="audio-convert">Audio Convert</option>
                    <option value="audio-compress">Audio Compress</option>
                </select>
            </div>
            <button id="startButton" onclick="startProcessing()">Start Processing</button>
        </div>

        <!-- Progress Section -->
        <div class="progress-container" id="progressContainer">
            <h2>Processing <span id="statusBadge"></span></h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <p id="progressText" style="color: #666; font-size: 14px;">Initializing...</p>
            <button id="downloadButton" class="download-button" style="display: none;" onclick="downloadFile()">
                Download Result
            </button>
        </div>

        <!-- Log Section -->
        <div class="section">
            <h2>📋 Activity Log</h2>
            <div class="log-container" id="logContainer">
                <div class="log-entry log-info">Ready to process media files...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentJobId = null;
        let downloadUrl = null;
        let eventSource = null;

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateProgress(percent, status, message) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const statusBadge = document.getElementById('statusBadge');

            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
            progressText.textContent = message || `Processing... ${percent}%`;

            if (status) {
                statusBadge.className = `status-badge status-${status}`;
                statusBadge.textContent = status.toUpperCase();
            }
        }

        function setButtonState(enabled) {
            document.getElementById('startButton').disabled = !enabled;
        }

        async function startProcessing() {
            const fileInput = document.getElementById('fileInput');
            const operationType = document.getElementById('operationType').value;

            if (!fileInput.files || fileInput.files.length === 0) {
                log('Please select a file first', 'error');
                return;
            }

            const file = fileInput.files[0];
            log(`Selected file: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`, 'info');

            try {
                setButtonState(false);
                document.getElementById('progressContainer').classList.add('active');
                updateProgress(0, 'pending', 'Requesting upload URL...');

                // Step 1: Get upload URL
                log('Requesting upload URL from API...', 'info');
                const uploadUrlResponse = await fetch(`${API_BASE}/upload-url`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileName: file.name,
                        fileType: file.type,
                        fileSize: file.size
                    })
                });

                if (!uploadUrlResponse.ok) {
                    const error = await uploadUrlResponse.json();
                    throw new Error(error.message || 'Failed to get upload URL');
                }

                const uploadUrlData = await uploadUrlResponse.json();
                const { uploadUrl, objectKey } = uploadUrlData.data;
                log(`Upload URL generated: ${objectKey}`, 'success');

                // Step 2: Upload file to R2
                updateProgress(5, 'pending', 'Uploading file to R2...');
                log('Uploading file directly to Cloudflare R2...', 'info');

                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type },
                    body: file
                });

                if (!uploadResponse.ok) {
                    throw new Error('Failed to upload file to R2');
                }

                log('File uploaded successfully to R2', 'success');
                updateProgress(10, 'pending', 'File uploaded to R2');

                // Step 3: Start processing job
                log(`Starting ${operationType} job...`, 'info');
                updateProgress(15, 'pending', 'Creating processing job...');

                const options = getOptionsForOperation(operationType);
                const startJobResponse = await fetch(`${API_BASE}/start-job`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        objectKey,
                        operationType,
                        options
                    })
                });

                if (!startJobResponse.ok) {
                    const error = await startJobResponse.json();
                    throw new Error(error.message || 'Failed to start job');
                }

                const jobData = await startJobResponse.json();
                currentJobId = jobData.data.jobId;
                const jobStatus = jobData.data.status;
                log(`Job created: ${currentJobId}`, 'success');

                if (jobData.data.queuePosition) {
                    log(`Job queued at position ${jobData.data.queuePosition}`, 'warning');
                    updateProgress(20, 'queued', `Queue position: ${jobData.data.queuePosition}`);
                } else {
                    updateProgress(20, 'processing', 'Starting FFmpeg processing...');
                }

                // Step 4: Monitor progress with SSE
                monitorJobProgress(currentJobId);

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                updateProgress(0, 'failed', error.message);
                setButtonState(true);
            }
        }

        function monitorJobProgress(jobId) {
            log('Connecting to progress stream...', 'info');

            eventSource = new EventSource(`${API_BASE}/job-status/${jobId}`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'progress') {
                    updateProgress(data.progress, data.status, `Processing: ${data.timemark || ''}`);
                    log(`Progress: ${data.progress}% - ${data.timemark || ''}`, 'info');

                    if (data.queuePosition) {
                        log(`Queue position: ${data.queuePosition}`, 'warning');
                    }
                }
                else if (data.type === 'complete') {
                    log('Processing completed successfully!', 'success');
                    updateProgress(100, 'completed', 'Processing complete!');
                    eventSource.close();

                    // Get download URL
                    getDownloadUrl(jobId);
                }
                else if (data.type === 'error') {
                    log(`Job failed: ${data.message}`, 'error');
                    updateProgress(0, 'failed', data.message);
                    eventSource.close();
                    setButtonState(true);
                }
            };

            eventSource.onerror = (error) => {
                log('Connection error to progress stream', 'error');
                eventSource.close();
            };
        }

        async function getDownloadUrl(jobId) {
            try {
                log('Generating download URL...', 'info');

                const response = await fetch(`${API_BASE}/download-url/${jobId}`);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to get download URL');
                }

                const data = await response.json();
                downloadUrl = data.data.downloadUrl;

                log(`Download URL generated (expires at ${new Date(data.data.expiresAt).toLocaleTimeString()})`, 'success');
                log(`File size: ${(data.data.fileSize / 1024 / 1024).toFixed(2)} MB`, 'info');

                document.getElementById('downloadButton').style.display = 'block';
                setButtonState(true);

            } catch (error) {
                log(`Error getting download URL: ${error.message}`, 'error');
                setButtonState(true);
            }
        }

        function downloadFile() {
            if (downloadUrl) {
                log('Starting download...', 'info');
                window.location.href = downloadUrl;
                log('Download initiated!', 'success');

                // Cleanup after download
                setTimeout(() => {
                    if (currentJobId) {
                        cleanupJob(currentJobId);
                    }
                }, 2000);
            }
        }

        async function cleanupJob(jobId) {
            try {
                log('Cleaning up job files...', 'info');

                await fetch(`${API_BASE}/cleanup/${jobId}`, {
                    method: 'POST'
                });

                log('Job cleaned up successfully', 'success');
                currentJobId = null;
                downloadUrl = null;

            } catch (error) {
                log(`Cleanup error: ${error.message}`, 'warning');
            }
        }

        function getOptionsForOperation(operationType) {
            switch (operationType) {
                case 'video-compress':
                    return {
                        codec: 'h264',
                        resolution: '720p',
                        preset: 'medium',
                        audioOption: 'compress'
                    };
                case 'extract-audio':
                    return {
                        trackIndex: 0,
                        format: 'mp3'
                    };
                case 'audio-convert':
                    return {
                        format: 'mp3',
                        bitrate: '192k',
                        sampleRate: 44100
                    };
                case 'audio-compress':
                    return {
                        bitrate: '128k',
                        sampleRate: 44100,
                        channels: 2
                    };
                default:
                    return {};
            }
        }
    </script>
</body>

</html>
